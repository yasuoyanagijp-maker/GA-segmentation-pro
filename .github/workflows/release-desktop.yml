name: Windows desktop build

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pyinstaller
      - name: Build windowed apps
        run: python scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/pro/GA Segmentation Pro.exe
            dist/optos/GA Segmentation Optos.exe
          if-no-files-found: error
